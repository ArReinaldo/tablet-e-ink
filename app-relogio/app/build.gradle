plugins {
    id 'com.android.application'
}

android {
    namespace 'br.tabletink.cabeceira'
    compileSdk 34

    defaultConfig {
        applicationId 'br.tabletink.cabeceira'
        minSdk 30
        targetSdk 34
        versionCode 2
        versionName '0.2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
